<!DOCTYPE html>
<html>
<head><title>Create Yippie Icons</title></head>
<body>
<p>Generating icons…</p>
<script>
const svgSource = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#000000"/>

  <line x1="16" y1="16" x2="9.5" y2="9.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <circle cx="27.3" cy="9.5" r="0.7" fill="#FFFFFF" opacity="0.78"/>
  <circle cx="28.6" cy="12.6" r="1.6" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="29.0" cy="16.0" r="1.0" fill="#FFFFFF" opacity="0.88"/>
  <circle cx="28.6" cy="19.4" r="1.4" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="27.3" cy="22.5" r="0.6" fill="#FFFFFF" opacity="0.72"/>
  <circle cx="25.2" cy="25.2" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="22.5" cy="27.3" r="0.9" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="19.4" cy="28.6" r="1.1" fill="#FFFFFF" opacity="0.88"/>
  <circle cx="18.9" cy="8.0" r="1.2" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="21.5" cy="9.5" r="0.7" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="23.4" cy="11.8" r="1.4" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="24.4" cy="14.5" r="0.6" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="24.4" cy="17.5" r="1.5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="23.4" cy="20.2" r="0.8" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="21.5" cy="22.5" r="1.3" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="18.9" cy="24.0" r="0.7" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="18.5" cy="11.7" r="0.9" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="20.7" cy="14.3" r="0.9" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="20.7" cy="17.7" r="0.9" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="18.5" cy="20.3" r="0.9" fill="#FFFFFF" opacity="0.65"/>
  <line x1="16" y1="16" x2="18.5" y2="11.7" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="16" y1="16" x2="20.7" y2="14.3" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="18.5" y1="11.7" x2="21.5" y2="9.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="20.7" y1="14.3" x2="24.4" y2="14.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="20.7" y1="17.7" x2="24.4" y2="17.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="18.5" y1="20.3" x2="21.5" y2="22.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="21.5" y1="9.5" x2="25.2" y2="6.8" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="24.4" y1="14.5" x2="28.6" y2="12.6" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="24.4" y1="17.5" x2="29.0" y2="16.0" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="23.4" y1="20.2" x2="27.3" y2="22.5" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="21.5" y1="22.5" x2="25.2" y2="25.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="18.9" y1="8.0" x2="22.5" y2="4.7" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
  <line x1="18.9" y1="24.0" x2="22.5" y2="27.3" stroke="#FFFFFF" stroke-width="0.5" opacity="0.45"/>
</svg>`;

const blob = new Blob([svgSource], { type: 'image/svg+xml' });
const url  = URL.createObjectURL(blob);
const img  = new Image();

img.onload = () => {
  [16, 32, 48, 128].forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width  = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, size, size);

    const link = document.createElement('a');
    link.download = `icon${size}.png`;
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
  });

  URL.revokeObjectURL(url);
  document.querySelector('p').textContent =
    'Done! Move the 4 downloaded files into apps/extension/icons/';
};

img.src = url;
</script>
</body>
</html>
