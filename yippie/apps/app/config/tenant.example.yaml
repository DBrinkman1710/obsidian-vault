tenant_id: "acme-corp"
tenant_name: "Acme Corp"

# Remove any module from this list to disable it for this client
enabled_modules:
  - contacts
  - tickets
  - billing
  - activity
  - inbox
  - chat

branding:
  primary_color: "#2563EB"
  logo_url: null

features:
  max_users: 25
  max_contacts: 10000
  auto_close_days: 7   # tickets in "waiting" auto-close after this many days

inbox:
  inbound_email: "support@acme.smb-platform.com"
  mailgun_domain: "mg.acme.com"
  mailgun_api_key: ""

# WhatsApp Business via Meta Cloud API
# Set up at: https://developers.facebook.com/apps/ → WhatsApp → API Setup
whatsapp:
  phone_number_id: ""       # From Meta Developer Console → WhatsApp → API Setup
  access_token: ""          # Permanent system user token from Meta Business Manager
  verify_token: "my-secret-verify-token"  # Any string you choose (set same in Meta webhook settings)
  display_phone: "+31600000000"           # Your WhatsApp Business number (shown in UI)
