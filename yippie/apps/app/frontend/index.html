<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Yippie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #fff; z-index: 9999;
      }
      #splash img { width: 40px; height: 40px; margin-bottom: 20px; }
      #splash-ring {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #e8f0fd; border-top-color: #5BA4F5;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo-white-bg-mark.svg" alt="Yippie" />
      <div id="splash-ring"></div>
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var splash = document.getElementById('splash');
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 0.2s';
            setTimeout(function() { splash.remove(); }, 200);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
