<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Yippie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center; background: #fff; z-index: 9999;
      }
      #splash-wrap {
        position: relative; width: 72px; height: 72px;
        display: flex; align-items: center; justify-content: center;
      }
      #splash-wrap img { width: 40px; height: 40px; position: relative; z-index: 1; }
      #splash-ring {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, #5BA4F5 0%, rgba(91,164,245,0.15) 70%, rgba(91,164,245,0) 100%);
        animation: spin 1s linear infinite;
      }
      #splash-ring::after {
        content: ''; position: absolute; inset: 4px;
        background: #fff; border-radius: 50%;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-wrap">
        <div id="splash-ring"></div>
        <img src="/logo-white-bg-mark.svg" alt="Yippie" />
      </div>
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var splash = document.getElementById('splash');
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 0.2s';
            setTimeout(function() { splash.remove(); }, 200);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
