[pytest]
# pytest-asyncio is installed but was previously unconfigured. "auto" lets async
# test/fixture functions run without a per-function @pytest.mark.asyncio decorator.
asyncio_mode = auto
# Pin the async fixture loop scope so pytest-asyncio 0.24 stops warning about the default.
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    dbtest: smoke test that needs a live Postgres (skipped unless TEST_DATABASE_URL is set)
